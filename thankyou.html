<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="format-detection" content="telephone=no">
<title>شكراً | XM Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050507;--surface:#0d0d0f;--surface2:#141416;
  --border:rgba(212,175,55,0.08);--border2:rgba(212,175,55,0.18);
  --text:#f5f0e8;--muted:#7a7060;
  --gold:#d4af37;--gold2:#f0c040;--gold3:#b8962a;
  --green:#2ecc71;
  --r:10px;--r2:16px;--r3:22px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:20px;}
body::before{content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 70% 50% at 50% 30%,rgba(212,175,55,0.06) 0%,transparent 60%);
  pointer-events:none;}
body::after{content:'';position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(rgba(212,175,55,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,0.02) 1px,transparent 1px);
  background-size:60px 60px;pointer-events:none;}

/* PARTICLES */
.particles{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
.pt{position:absolute;border-radius:50%;animation:ptUp 5s ease-in forwards;}
@keyframes ptUp{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.8}90%{opacity:.4}100%{transform:translateY(-20vh) scale(1);opacity:0}}

.card{position:relative;z-index:10;background:var(--surface);border:1px solid var(--border);border-radius:var(--r3);padding:44px 28px 36px;max-width:380px;width:100%;text-align:center;box-shadow:0 0 80px rgba(212,175,55,0.05),0 40px 80px rgba(0,0,0,0.6);animation:cardIn .6s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes cardIn{from{transform:translateY(40px) scale(.95);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}

.crown{width:80px;height:80px;border-radius:50%;margin:0 auto 24px;background:rgba(212,175,55,0.08);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:34px;animation:pop .5s .3s cubic-bezier(.34,1.56,.64,1) both;position:relative;}
.crown::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(212,175,55,0.15);animation:spinRing 4s linear infinite;}
@keyframes spinRing{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

.title{font-family:'Cinzel',serif;font-size:20px;font-weight:700;margin-bottom:6px;color:var(--gold);animation:fu .5s .4s both;}
.sub{font-size:9px;color:var(--muted);letter-spacing:4px;margin-bottom:28px;animation:fu .5s .5s both;}
@keyframes fu{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

.deal-box{background:rgba(212,175,55,0.05);border:1px solid var(--border2);border-radius:var(--r2);padding:16px 20px;margin-bottom:20px;animation:fu .5s .6s both;position:relative;}
.deal-box::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:40%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.dl-label{font-size:9px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;}
.dl-id{font-family:'Cinzel',serif;font-size:26px;font-weight:700;color:var(--gold2);letter-spacing:5px;}

.info-list{display:flex;flex-direction:column;gap:10px;margin-bottom:26px;animation:fu .5s .7s both;}
.info-row{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--muted);}
.info-row span:first-child{font-size:16px;flex-shrink:0;}

.btn-p{width:100%;padding:16px;background:linear-gradient(135deg,var(--gold3),var(--gold2));border:none;border-radius:var(--r2);color:#050507;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 4px 20px rgba(212,175,55,0.25);transition:all .2s;margin-bottom:10px;letter-spacing:.5px;animation:fu .5s .8s both;}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(212,175,55,0.4);}
.btn-s{width:100%;padding:14px;background:transparent;border:1px solid var(--border2);border-radius:var(--r2);color:var(--gold);font-family:'Tajawal',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;animation:fu .5s .9s both;}
.btn-s:hover{background:rgba(212,175,55,0.06);}

.fab{position:fixed;left:16px;z-index:9999;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform .2s;box-shadow:0 4px 16px rgba(0,0,0,0.4);}
.fab:hover{transform:scale(1.08);}
.fab-fb{bottom:20px;background:#1877f2;}
.fab-info{bottom:80px;background:linear-gradient(135deg,var(--gold3),var(--gold));font-size:18px;}
</style>
</head>
<body>
<div class="particles" id="pts"></div>

<div class="card">
  <div class="crown">🏆</div>
  <div class="title" id="tTitle">تم إرسال التحويل!</div>
  <div class="sub" id="tSub">TRANSFER SENT SUCCESSFULLY</div>

  <div class="deal-box" id="dealBox" style="display:none">
    <div class="dl-label" id="dlLbl">رقم الصفقة</div>
    <div class="dl-id" id="dlId"></div>
  </div>

  <div class="info-list">
    <div class="info-row"><span>⏳</span><span id="i1">إثبات التحويل وصل للإدارة وجاري المراجعة</span></div>
    <div class="info-row"><span>💰</span><span id="i2">ستستلم أرباحك خلال ساعة من تأكيد الإدارة</span></div>
    <div class="info-row"><span>📋</span><span id="i3">احتفظ برقم صفقتك لمتابعة الحالة</span></div>
  </div>

  <button class="btn-p" id="bTrack" onclick="goTrack()">📊 متابعة الصفقة</button>
  <button class="btn-s" id="bHome" onclick="goHome()">🏠 الصفحة الرئيسية</button>
</div>

<a class="fab fab-fb" href="https://www.facebook.com/share/1BqAEE93yu/?mibextid=wwXIfr" target="_blank">
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
</a>
<a class="fab fab-info" href="about.html">ℹ️</a>

<script>
const T={
  ar:{dir:"rtl",title:"تم إرسال التحويل!",sub:"TRANSFER SENT SUCCESSFULLY",dlLbl:"رقم الصفقة",i1:"إثبات التحويل وصل للإدارة وجاري المراجعة",i2:"ستستلم أرباحك خلال ساعة من تأكيد الإدارة",i3:"احتفظ برقم صفقتك لمتابعة الحالة",bTrack:"📊 متابعة الصفقة",bHome:"🏠 الصفحة الرئيسية"},
  en:{dir:"ltr",title:"Transfer Sent!",sub:"TRANSFER SENT SUCCESSFULLY",dlLbl:"TRADE NUMBER",i1:"Your transfer proof has been received and is under review",i2:"You'll receive your profits within 1 hour of admin confirmation",i3:"Keep your trade number to track your status",bTrack:"📊 Track Trade",bHome:"🏠 Home"}
};
const l=localStorage.lang||(navigator.language.startsWith("en")?"en":"ar"),t=T[l];
document.documentElement.dir=t.dir;document.documentElement.lang=l;
const s=(id,v)=>{const e=document.getElementById(id);if(e)e.innerText=v;};
s("tTitle",t.title);s("tSub",t.sub);s("dlLbl",t.dlLbl);s("i1",t.i1);s("i2",t.i2);s("i3",t.i3);s("bTrack",t.bTrack);s("bHome",t.bHome);

const params=new URLSearchParams(window.location.search),dealId=params.get("deal");
if(dealId){document.getElementById("dealBox").style.display="block";document.getElementById("dlId").innerText=dealId;}
function goTrack(){window.location.href=dealId?"index.html?deal="+dealId:"index.html";}
function goHome(){window.location.href="index.html";}

// Gold particles
const cols=["#d4af37","#f0c040","#b8962a","rgba(212,175,55,0.5)"];
const c=document.getElementById("pts");
for(let i=0;i<28;i++){
  const p=document.createElement("div");p.className="pt";
  const sz=3+Math.random()*5;
  p.style.cssText=`left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*cols.length)]};animation-delay:${Math.random()*4}s;animation-duration:${4+Math.random()*3}s;width:${sz}px;height:${sz}px;`;
  c.appendChild(p);
}
</script>
</body>
</html>
